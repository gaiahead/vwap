<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VWAP</title>
  <link rel="icon" href="data:,"/>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css?v=data-etf-20260913-v9"/>
  <script defer src="app.js?v=data-etf-20260913-v9"></script>
</head>
<body>
<header><h1>VWAP</h1><p>VWAP 추세를 중심으로 ETF의 규모, 유동성과 보유자산을 함께 확인</p></header>
<main>
  <section class="panel" aria-labelledby="discovery-title">
    <h2 id="discovery-title">내게 맞는 ETF 찾기</h2>
    <div class="filters">
      <label class="search-label">통합 검색<input id="search" type="search" placeholder="ETF 이름, 티커, 분류, 운용사, 기초지수, 보유자산"/></label>
      <label>분류<select id="category"><option value="">전체 분류</option></select></label>
      <label>운용사<select id="issuer"><option value="">전체 운용사</option></select></label>
      <label>20일 평균 거래량 최소, 주<input id="min-volume" type="number" min="0" step="1000" placeholder="제한 없음"/></label>
      <button id="reset">초기화</button>
    </div>
    <p id="status" class="muted" role="status">ETF 목록을 불러오는 중…</p>
    <p class="muted">미확인 값은 -로 표시합니다. 평균 거래대금은 최근 20거래일 종가 × 거래량의 평균 추정치입니다. 순자산은 Naver ETF 목록의 규모 기준입니다.</p>
    <p id="count" aria-live="polite"></p>
    <div class="table-wrap" tabindex="0" role="region" aria-label="ETF 검색 결과, 가로로 스크롤 가능">
      <table><caption class="sr-only">ETF 비교 정보. 열 제목 버튼으로 정렬하고 ETF 이름으로 상세 정보를 엽니다.</caption><thead><tr id="etf-head"></tr></thead><tbody id="etf-body"></tbody></table>
    </div>
  </section>
  <section class="panel" id="detail-section" aria-labelledby="detail-title" hidden>
    <div class="detail-header"><h2 id="detail-title" tabindex="-1"></h2><button id="detail-close" aria-label="ETF 상세 닫기">닫기 ×</button></div>
    <div id="detail-content"></div>
  </section>
</main>
</body>
</html>
